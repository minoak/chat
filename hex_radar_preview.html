<!doctype html>
<html><head><meta charset="utf-8"><title>hex radar preview</title>
<style>
body {
  background: #16101e;
  color: #ebe2d0;
  font-family: Georgia, serif;
  padding: 24px;
}
.sample {
  background: #0a070f;
  border: 1px solid rgba(184,150,92,0.32);
  border-radius: 6px;
  padding: 24px;
  margin-bottom: 32px;
  max-width: 480px;
}
h2 {
  color: #b8965c;
  font-size: 14px;
  letter-spacing: 0.2em;
  margin: 0 0 8px;
}

/* ============================================
   Belladonna Academy · Tarot × LN (v3 — compact + modal)
   - 본문 끝은 한 줄 status + 두 trigger 칩만
   - 디테일은 좌측 슬라이드인 (Character Sheet / Inventory)
   - 6 스탯 = 육각형 레이더 (hover로 값 표시)
   - Schedule 패널 유지 (우측 사이드, ❖)
   ============================================ */

/* ============================================
   Merged Status Card (calendar + rpg-bar in one)
   ============================================ */
.status-card {
  position: relative;
  max-width: 720px;
  margin: 14px auto;
  background: #150e1f;
  border: 1px solid #b8965c;
  color: #ebe2d0;
  font-family: 'Noto Serif KR', '나눔명조', 'Nanum Myeongjo', '바탕', Batang, Georgia, serif;
  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,0.4),
    0 10px 24px rgba(0,0,0,0.45);
}
.status-card::before {
  content: "";
  position: absolute; inset: 4px;
  border: 0.5px solid rgba(184,150,92,0.32);
  pointer-events: none;
}
/* corner dots */
.status-card::after {
  content: "";
  position: absolute; inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(circle 1.5px at 11px 11px,                       #b8965c 95%, transparent 100%),
    radial-gradient(circle 1.5px at calc(100% - 11px) 11px,          #b8965c 95%, transparent 100%),
    radial-gradient(circle 1.5px at 11px calc(100% - 11px),          #b8965c 95%, transparent 100%),
    radial-gradient(circle 1.5px at calc(100% - 11px) calc(100% - 11px), #b8965c 95%, transparent 100%);
  background-repeat: no-repeat;
}

/* ------- Slim Calendar Strip (top of status card) ------- */
.cal-strip {
  position: relative;
  padding: 11px 18px 10px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 13px;
  color: rgba(235,226,208,0.78);
}
.cal-strip .cal-season {
  font-style: italic;
  color: #d4b577;
  font-size: 14px;
  letter-spacing: 0.02em;
}
.cal-strip .cal-pill {
  display: inline-block;
  font-family: Georgia, serif;
  font-size: 9px;
  letter-spacing: 0.4em;
  color: #b8965c;
  border: 1px solid rgba(184,150,92,0.55);
  padding: 2px 7px;
  text-transform: uppercase;
  font-variant: small-caps;
  line-height: 1.4;
}
.cal-strip .sep { color: rgba(184,150,92,0.4); font-size: 12px; }
.cal-strip .cal-day,
.cal-strip .cal-time {
  font-family: Georgia, serif;
  font-size: 10px;
  letter-spacing: 0.35em;
  color: rgba(235,226,208,0.7);
  text-transform: uppercase;
  font-variant: small-caps;
}
.cal-strip .cal-loc {
  font-family: Georgia, 'Times New Roman', serif;
  font-style: italic;
  color: #ebe2d0;
  font-size: 13px;
  letter-spacing: 0.02em;
}

.cal-detail-trigger {
  margin-left: auto;
  appearance: none;
  background: transparent;
  border: 1px solid rgba(184,150,92,0.55);
  color: #b8965c;
  font-family: Georgia, serif;
  font-size: 9px;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  font-variant: small-caps;
  padding: 5px 9px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s;
}
.cal-detail-trigger::before { content: "〈"; color: rgba(184,150,92,0.6); font-style: italic; font-family: Georgia, serif; }
.cal-detail-trigger::after  { content: "〉"; color: rgba(184,150,92,0.6); font-style: italic; font-family: Georgia, serif; }
.cal-detail-trigger:hover { color: #d4b577; border-color: #d4b577; background: rgba(184,150,92,0.08); }
.cal-detail-trigger:hover::before, .cal-detail-trigger:hover::after { color: #d4b577; }

/* native details/summary toggle */
.cal-block { display: block; }
.cal-block summary { list-style: none; cursor: pointer; }
.cal-block summary::-webkit-details-marker { display: none; }
.cal-block summary::marker { content: ""; }
.cal-block[open] .cal-detail-trigger { color: #d4b577; border-color: #d4b577; }
.cal-block[open] .cal-detail-trigger::before,
.cal-block[open] .cal-detail-trigger::after { content: "✦"; color: #d4b577; }

/* detail body — details handles hide/show natively */
.cal-detail-body {
  padding: 12px 18px 14px;
  border-top: 1px solid rgba(184,150,92,0.22);
}

.cal-detail-body .week-cal {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
  margin-bottom: 12px;
}
.cal-detail-body .day {
  padding: 9px 0 8px;
  text-align: center;
  background: rgba(20,14,30,0.5);
  border: 1px solid rgba(184,150,92,0.4);
  color: rgba(235,226,208,0.55);
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 12px;
  letter-spacing: 0.05em;
  transition: all 0.2s;
}
.cal-detail-body .day.today {
  background: #d4b577;
  color: #150e1f;
  border-color: #d4b577;
  font-weight: 600;
  box-shadow:
    inset 0 0 0 1px rgba(20,14,30,0.4),
    0 4px 14px rgba(212,181,119,0.25);
}

.cal-detail-body .info-rows { display: grid; gap: 4px; }
.cal-detail-body .info-row {
  display: grid;
  grid-template-columns: 80px 1fr;
  align-items: baseline;
  gap: 12px;
  padding: 4px 2px;
  border-bottom: 1px dashed rgba(184,150,92,0.18);
}
.cal-detail-body .info-row:last-child { border-bottom: 0; }
.cal-detail-body .info-row .k {
  font-family: Georgia, serif;
  font-size: 9px;
  letter-spacing: 0.4em;
  color: #b8965c;
  text-transform: uppercase;
  font-variant: small-caps;
}
.cal-detail-body .info-row .v {
  font-family: 'Noto Serif KR', '나눔명조', 'Nanum Myeongjo', '바탕', Batang, Georgia, serif;
  font-size: 13px;
  color: #ebe2d0;
  line-height: 1.5;
}
.cal-detail-body .info-row .v.italic {
  font-family: Georgia, 'Times New Roman', serif;
  font-style: italic;
  color: #d4b577;
}
.cal-detail-body .exam-flag {
  display: inline-block;
  border: 1px solid #c98da0;
  color: #c98da0;
  font-family: Georgia, serif;
  font-size: 9px;
  letter-spacing: 0.35em;
  padding: 1px 7px;
  margin-right: 6px;
  vertical-align: middle;
  text-transform: uppercase;
  font-variant: small-caps;
}

/* ------- Divider between calendar and rpg-bar ------- */
.strip-divider {
  height: 1px;
  margin: 0 14px;
  background: linear-gradient(90deg, transparent, rgba(184,150,92,0.45), transparent);
}

/* ------- Compact Status Bar (bottom row of status card) ------- */
.rpg-bar-compact {
  position: relative;
  padding: 12px 18px 11px;
  color: #ebe2d0;
  font-family: 'Noto Serif KR', '나눔명조', 'Nanum Myeongjo', '바탕', Batang, Georgia, serif;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  flex-wrap: wrap;
}

.rpg-bar-compact .stats-line {
  display: flex;
  align-items: baseline;
  gap: 22px;
  flex-wrap: wrap;
}
.rpg-bar-compact .stat {
  display: inline-flex;
  align-items: baseline;
  gap: 8px;
}
.rpg-bar-compact .stat .k {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 9px;
  letter-spacing: 0.4em;
  color: #b8965c;
  text-transform: uppercase;
  font-variant: small-caps;
}
.rpg-bar-compact .stat .v {
  font-family: Georgia, 'Times New Roman', serif;
  font-style: italic;
  font-weight: 500;
  font-size: 16px;
  color: #d4b577;
  line-height: 1;
}
.rpg-bar-compact .stat .v .max {
  color: rgba(235,226,208,0.32);
  font-size: 12px;
  margin-left: 2px;
}

.rpg-bar-compact .triggers {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.rpg-trigger {
  appearance: none;
  background: transparent;
  border: 1px solid rgba(184,150,92,0.55);
  color: #b8965c;
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 10px;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  font-variant: small-caps;
  padding: 8px 10px;
  cursor: pointer;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.rpg-trigger::before { content: "〈"; color: rgba(184,150,92,0.6); font-style: italic; font-size: 12px; }
.rpg-trigger::after  { content: "〉"; color: rgba(184,150,92,0.6); font-style: italic; font-size: 12px; }
.rpg-trigger:hover {
  color: #d4b577;
  border-color: #d4b577;
  background: rgba(184,150,92,0.08);
}
.rpg-trigger:hover::before,
.rpg-trigger:hover::after { color: #d4b577; }

/* ------- Change Chips (보조 모델 변경 시각화 자리) ------- */
.rpg-changes {
  max-width: 720px;
  margin: 6px auto 0;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: center;
}
.change-chip {
  font-family: Georgia, 'Times New Roman', serif;
  font-style: italic;
  font-size: 12px;
  padding: 4px 11px;
  border: 1px solid;
  background: rgba(10,7,15,0.5);
  letter-spacing: 0.02em;
}
.change-chip.gain { border-color: rgba(212,181,119,0.55); color: #d4b577; }
.change-chip.loss { border-color: rgba(122,42,61,0.7);   color: #c98da0; }
.change-chip.rose { border-color: rgba(201,141,160,0.55); color: #c98da0; }
.change-chip.item { border-color: rgba(184,150,92,0.55); color: #ebe2d0; }

/* ============================================
   Modal toggles (checkbox + :checked ~ trick)
   ============================================ */
.sheet-toggle, .inv-toggle { display: none; }

/* dim backdrop when sheet/inv open */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(10,7,15,0.65);
  z-index: 1000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.sheet-toggle:checked ~ .modal-backdrop.sheet-back,
.inv-toggle:checked   ~ .modal-backdrop.inv-back {
  opacity: 1;
  pointer-events: auto;
}

/* ============================================
   Character Sheet — slides in from LEFT
   ============================================ */
.sheet-panel {
  position: fixed;
  left: 0; top: 0;
  width: 60%;
  max-width: 620px;
  height: 100vh;
  background: #150e1f;
  border-right: 1.5px solid #b8965c;
  box-shadow: 12px 0 32px rgba(0,0,0,0.7);
  z-index: 1010;
  overflow-y: auto;
  padding: 38px 36px 60px;
  box-sizing: border-box;
  transform: translateX(-100%);
  transition: transform 0.4s cubic-bezier(.2,.6,.2,1);
  color: #ebe2d0;
  font-family: 'Noto Serif KR', '나눔명조', 'Nanum Myeongjo', '바탕', Batang, Georgia, serif;
}
.sheet-toggle:checked ~ .sheet-panel { transform: translateX(0); }

.sheet-panel::-webkit-scrollbar { width: 6px; }
.sheet-panel::-webkit-scrollbar-thumb { background: #6e5634; }
.sheet-panel::-webkit-scrollbar-track { background: #0a070f; }

@media (max-width: 768px) {
  .sheet-panel { width: 100%; max-width: none; }
}

/* close button */
.sheet-close, .inv-close {
  position: absolute;
  top: 18px; right: 18px;
  width: 32px; height: 32px;
  border: 1px solid rgba(184,150,92,0.55);
  background: transparent;
  color: #b8965c;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Georgia, serif;
  font-size: 14px;
  transition: 0.2s;
}
.sheet-close:hover, .inv-close:hover {
  color: #d4b577;
  border-color: #d4b577;
}

/* sheet header */
.sheet-header {
  text-align: center;
  margin-bottom: 24px;
  padding-bottom: 18px;
  border-bottom: 1px solid rgba(184,150,92,0.32);
}
.sheet-header .roundel {
  width: 38px; height: 38px;
  border: 1.2px solid #b8965c;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: #150e1f;
  margin: 0 auto 10px;
  font-family: Georgia, serif;
  font-size: 16px;
  color: #d4b577;
  position: relative;
}
.sheet-header .roundel::before {
  content: "";
  position: absolute; inset: -5px;
  border: 0.5px solid rgba(184,150,92,0.32);
  border-radius: 50%;
}
.sheet-header .title {
  font-family: Georgia, 'Times New Roman', serif;
  font-style: italic;
  font-weight: 500;
  font-size: 28px;
  color: #ebe2d0;
  line-height: 1;
  margin-bottom: 6px;
}
.sheet-header .subtitle {
  font-family: Georgia, serif;
  font-size: 10px;
  letter-spacing: 0.55em;
  color: #b8965c;
  text-transform: uppercase;
  font-variant: small-caps;
}

/* sheet core stats (CP, Level, Gold, EXP) */
.sheet-core {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 0;
  margin-bottom: 4px;
}
.sheet-core .cell {
  text-align: center;
  padding: 12px 6px;
}
.sheet-core .cell + .cell { border-left: 1px solid rgba(184,150,92,0.32); }
.sheet-core .cell .k {
  font-family: Georgia, serif;
  font-size: 9px;
  letter-spacing: 0.4em;
  color: #b8965c;
  text-transform: uppercase;
  font-variant: small-caps;
  margin-bottom: 4px;
}
.sheet-core .cell .v {
  font-family: Georgia, serif;
  font-style: italic;
  font-weight: 500;
  font-size: 22px;
  color: #d4b577;
  line-height: 1;
}
.sheet-core .cell .v .max {
  color: rgba(235,226,208,0.32);
  font-size: 14px;
  margin-left: 1px;
}

/* CP / EXP bars */
.sheet-bars { margin: 12px 2px 8px; }
.sheet-bar-row { margin: 10px 0; }
.sheet-bar-row .label-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 5px;
}
.sheet-bar-row .label {
  font-family: Georgia, serif;
  font-size: 9px;
  letter-spacing: 0.4em;
  color: #b8965c;
  text-transform: uppercase;
  font-variant: small-caps;
}
.sheet-bar-row .nums {
  font-family: Georgia, serif;
  font-style: italic;
  font-size: 13px;
  color: rgba(235,226,208,0.78);
}
.sheet-bar-row .nums .max { color: rgba(235,226,208,0.32); }
.sheet-bar-row .bar {
  width: 100%;
  height: 3px;
  background: #0a070f;
  border: 1px solid rgba(184,150,92,0.32);
  overflow: hidden;
}
.sheet-bar-row .bar > div {
  height: 100%;
  background: linear-gradient(90deg, #6e5634, #b8965c, #d4b577);
}

/* ============================================
   Hexagon Radar Chart (Attributes)
   ============================================ */
.hex-section {
  margin: 24px 0 18px;
  text-align: center;
}
.hex-title {
  font-family: Georgia, serif;
  font-size: 10px;
  letter-spacing: 0.55em;
  color: #b8965c;
  text-transform: uppercase;
  font-variant: small-caps;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
}
.hex-title::before, .hex-title::after {
  content: "";
  flex: 0 0 56px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(184,150,92,0.55), transparent);
}

.hex-wrap {
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
}
.hex-wrap svg {
  width: 320px;
  height: 300px;
  overflow: visible;
}

/* hex chart parts */
.hex-bg-99 { stroke: rgba(184,150,92,0.28); stroke-width: 1; fill: rgba(20,14,30,0.4); }
.hex-bg-66 { stroke: rgba(184,150,92,0.18); stroke-width: 0.8; fill: none; stroke-dasharray: 2 3; }
.hex-bg-33 { stroke: rgba(184,150,92,0.14); stroke-width: 0.6; fill: none; stroke-dasharray: 2 3; }
.hex-axis  { stroke: rgba(184,150,92,0.24); stroke-width: 1; }
.hex-value { stroke: #d4b577; stroke-width: 2; stroke-linecap: round; transition: stroke 0.2s, stroke-width 0.2s; opacity: 0.55; }
.hex-fill  { fill: rgba(212,181,119,0.18); stroke: #d4b577; stroke-width: 2; stroke-linejoin: round; transition: fill 0.3s; }
.hex-cap   { fill: #d4b577; transition: r 0.2s, fill 0.2s; }
.hex-vertex-dot { fill: rgba(184,150,92,0.6); }
.hex-label {
  fill: #b8965c;
  font-family: Georgia, serif;
  font-size: 11px;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  text-anchor: middle;
  transition: fill 0.2s;
}

/* hover sector (invisible circle around each vertex) */
.hex-hit { fill: transparent; cursor: pointer; pointer-events: all; }

/* tooltip (value + bonus) — hidden by default */
.hex-tip {
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
}
.hex-tip-bg { fill: #0a070f; stroke: #d4b577; stroke-width: 1; }
.hex-tip-val {
  fill: #d4b577;
  font-family: Georgia, serif;
  font-style: italic;
  font-weight: 500;
  font-size: 18px;
  text-anchor: middle;
}
.hex-tip-bonus {
  fill: rgba(235,226,208,0.6);
  font-family: Georgia, serif;
  font-style: italic;
  font-size: 11px;
  text-anchor: middle;
}

/* on hover — light up sector */
.hex-sector:hover .hex-tip { opacity: 1; }
.hex-sector:hover .hex-label { fill: #d4b577; }
.hex-sector:hover .hex-value { stroke: #ffffff; stroke-width: 4; }
.hex-sector:hover .hex-cap   { fill: #ffffff; r: 5; }

/* ============================================
   Effects / Traits sections inside sheet
   ============================================ */
.sheet-section {
  margin: 18px 0 6px;
  border-top: 1px solid rgba(184,150,92,0.32);
  padding-top: 16px;
}
.sheet-section-title {
  font-family: Georgia, serif;
  font-size: 10px;
  letter-spacing: 0.55em;
  color: #b8965c;
  text-transform: uppercase;
  font-variant: small-caps;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
}
.sheet-section-title::before, .sheet-section-title::after {
  content: "";
  flex: 1; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(184,150,92,0.55), transparent);
}
.sheet-section .text {
  font-family: 'Noto Serif KR', '나눔명조', 'Nanum Myeongjo', '바탕', Batang, Georgia, serif;
  font-weight: 300;
  font-size: 13px;
  line-height: 1.95;
  color: rgba(235,226,208,0.85);
  white-space: pre-line;
  letter-spacing: 0.02em;
  padding: 2px 6px;
}
.sheet-section .text.effect { font-style: italic; color: rgba(235,226,208,0.78); }

/* ============================================
   Inventory Panel — slides in from LEFT (offset)
   ============================================ */
.inv-panel {
  position: fixed;
  left: 0; top: 0;
  width: 48%;
  max-width: 520px;
  height: 100vh;
  background: #150e1f;
  border-right: 1.5px solid #b8965c;
  box-shadow: 12px 0 32px rgba(0,0,0,0.7);
  z-index: 1010;
  overflow-y: auto;
  padding: 38px 32px 60px;
  box-sizing: border-box;
  transform: translateX(-100%);
  transition: transform 0.4s cubic-bezier(.2,.6,.2,1);
  color: #ebe2d0;
  font-family: 'Noto Serif KR', '나눔명조', 'Nanum Myeongjo', '바탕', Batang, Georgia, serif;
}
.inv-toggle:checked ~ .inv-panel { transform: translateX(0); }

.inv-panel::-webkit-scrollbar { width: 6px; }
.inv-panel::-webkit-scrollbar-thumb { background: #6e5634; }
.inv-panel::-webkit-scrollbar-track { background: #0a070f; }

@media (max-width: 768px) {
  .inv-panel { width: 100%; max-width: none; }
}

.inv-header {
  text-align: center;
  margin-bottom: 24px;
  padding-bottom: 18px;
  border-bottom: 1px solid rgba(184,150,92,0.32);
}
.inv-header .roundel {
  width: 32px; height: 32px;
  border: 1px solid #b8965c;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 8px;
  color: #d4b577;
  font-family: Georgia, serif;
  font-size: 14px;
}
.inv-header .title {
  font-family: Georgia, serif;
  font-style: italic;
  font-weight: 500;
  font-size: 24px;
  color: #ebe2d0;
  line-height: 1;
}
.inv-header .subtitle {
  font-family: Georgia, serif;
  font-size: 10px;
  letter-spacing: 0.55em;
  color: #b8965c;
  text-transform: uppercase;
  font-variant: small-caps;
  margin-top: 6px;
}

/* items area — let existing {{getvar::player_items_html}} render here */
.inv-items {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 10px;
}

/* override existing .rpg-item-button to fit tarot tone */
.rpg-item-button {
  appearance: none;
  background: #1a1226;
  border: 1px solid rgba(184,150,92,0.55);
  color: #d4b577;
  font-family: Georgia, serif;
  font-size: 11px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  font-variant: small-caps;
  padding: 14px 12px;
  cursor: pointer;
  transition: all 0.2s;
  border-radius: 0;
  text-align: center;
  box-shadow: none;
  font-weight: 400;
  width: 100%;
}
.rpg-item-button:hover {
  color: #ffffff;
  border-color: #d4b577;
  background: rgba(184,150,92,0.1);
  transform: none;
}

/* ============================================
   Schedule side panel (right, ❖) — kept from v2
   ============================================ */
.schedule-buttons-container {
  position: fixed; right: 22px; top: 130px;
  display: flex; flex-direction: column; gap: 14px;
  z-index: 1000;
}
.btn-schedule {
  width: 52px; height: 52px;
  border-radius: 50%;
  border: 1.2px solid #b8965c;
  background: #150e1f;
  color: #d4b577;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-family: Georgia, serif;
  font-size: 18px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.5);
  position: relative;
  overflow: visible;
  transition: all 0.25s;
}
.btn-schedule::before {
  content: "";
  position: absolute; inset: -5px;
  border: 0.5px solid rgba(184,150,92,0.32);
  border-radius: 50%;
}
.btn-schedule::after {
  content: "❖";
  font-size: 18px;
  color: #d4b577;
}
.btn-schedule:hover { background: #1a1226; }

#schedule-toggle { display: none; }

.schedule-panel {
  position: fixed;
  right: 0; top: 0;
  width: 38%;
  max-width: 460px;
  height: 100vh;
  background: #150e1f;
  border-left: 1.5px solid #b8965c;
  box-shadow: -10px 0 30px rgba(0,0,0,0.7);
  z-index: 990;
  overflow-y: auto;
  padding: 30px 28px 40px;
  box-sizing: border-box;
  transform: translateX(100%);
  transition: transform 0.35s cubic-bezier(.2,.6,.2,1);
  color: #ebe2d0;
  font-family: 'Noto Serif KR', '나눔명조', 'Nanum Myeongjo', '바탕', Batang, Georgia, serif;
}
#schedule-toggle:checked ~ .schedule-panel { transform: translateX(0); }

.schedule-panel::-webkit-scrollbar { width: 6px; }
.schedule-panel::-webkit-scrollbar-thumb { background: #6e5634; }
.schedule-panel::-webkit-scrollbar-track { background: #0a070f; }

@media (max-width: 768px) {
  .schedule-panel { width: 100%; max-width: none; }
}

.sched-header {
  text-align: center;
  margin-bottom: 22px;
  padding-bottom: 14px;
  border-bottom: 1px solid rgba(184,150,92,0.32);
}
.sched-header .roundel {
  width: 32px; height: 32px;
  border: 1px solid #b8965c;
  border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  margin: 0 auto 8px;
  color: #d4b577;
  font-family: Georgia, serif;
  font-size: 14px;
}
.sched-header .title {
  font-family: Georgia, serif;
  font-style: italic;
  font-weight: 500;
  font-size: 24px;
  color: #ebe2d0;
  line-height: 1;
}
.sched-header .subtitle {
  font-family: Georgia, serif;
  font-size: 10px;
  letter-spacing: 0.5em;
  color: #b8965c;
  text-transform: uppercase;
  font-variant: small-caps;
  margin-top: 6px;
}

.sched-block {
  background: #1a1226;
  border: 1px solid rgba(184,150,92,0.32);
  padding: 14px 16px;
  margin-bottom: 20px;
}
.sched-block .row {
  display: flex; gap: 12px; align-items: baseline;
  padding: 4px 0;
}
.sched-block .row + .row { border-top: 1px solid rgba(184,150,92,0.32); }
.sched-block .label {
  font-family: Georgia, serif;
  font-size: 10px;
  letter-spacing: 0.4em;
  color: #b8965c;
  text-transform: uppercase;
  font-variant: small-caps;
  min-width: 56px;
}
.sched-block .val {
  font-family: Georgia, serif;
  font-style: italic;
  font-size: 15px;
  color: #ebe2d0;
}

.sched-section-title {
  text-align: center;
  font-family: Georgia, serif;
  font-size: 11px;
  letter-spacing: 0.5em;
  color: #b8965c;
  text-transform: uppercase;
  font-variant: small-caps;
  margin: 22px 0 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
}
.sched-section-title::before, .sched-section-title::after {
  content: "";
  flex: 1; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(184,150,92,0.55), transparent);
}

.sched-grid { display: grid; gap: 6px; }
.sched-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
.sched-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }

.sched-btn {
  appearance: none;
  background: transparent;
  border: 1px solid rgba(184,150,92,0.55);
  color: rgba(235,226,208,0.78);
  font-family: Georgia, serif;
  font-size: 11px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  font-variant: small-caps;
  padding: 13px 6px;
  cursor: pointer;
  transition: all 0.2s;
}
.sched-btn:hover {
  color: #d4b577;
  border-color: #d4b577;
  background: rgba(184,150,92,0.06);
}
.sched-btn.full { grid-column: 1 / -1; }

.sched-start {
  display: block;
  width: 100%;
  appearance: none;
  margin-top: 22px;
  background: #7a2a3d;
  border: 1px solid #d4b577;
  color: #d4b577;
  font-family: Georgia, serif;
  font-size: 12px;
  letter-spacing: 0.45em;
  text-transform: uppercase;
  font-variant: small-caps;
  padding: 15px;
  cursor: pointer;
  box-shadow: inset 0 0 0 1px rgba(212,181,119,0.2), 0 6px 18px rgba(122,42,61,0.4);
}
.sched-start:hover { background: #a83d56; }
