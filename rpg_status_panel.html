<!-- RPG Status Panel Template -->
<!-- RisuAI 정규식 디스플레이 변환에서 <Panel>★를 이 HTML로 치환하세요 -->

<div class="rpg-status-panel" style="
    border: 2px solid #8B4513;
    padding: 15px;
    margin: 15px 0;
    background: linear-gradient(135deg, #2a1810 0%, #1a0f08 100%);
    border-radius: 10px;
    font-family: 'Noto Sans KR', serif;
    color: #f0e6d2;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
">
    <!-- 헤더 -->
    <div style="
        text-align: center;
        font-size: 1.3em;
        font-weight: bold;
        color: #FFD700;
        margin-bottom: 12px;
        border-bottom: 2px solid #8B4513;
        padding-bottom: 10px;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    ">
        ⚔️ RPG 스테이터스 ⚔️
    </div>

    <!-- 기본 정보 -->
    <div style="
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 12px;
        padding: 10px;
        background: rgba(139, 69, 19, 0.2);
        border-radius: 5px;
    ">
        <div style="color: #87CEEB;">
            <strong>📊 레벨:</strong> <span style="color: #FFD700;">{{player_level}}</span>
        </div>
        <div style="color: #90EE90;">
            <strong>💰 골드:</strong> <span style="color: #FFD700;">{{player_gold}}G</span>
        </div>
        <div style="color: #DDA0DD; grid-column: 1 / -1;">
            <strong>✨ 경험치:</strong>
            <span style="color: #FFD700;">{{player_exp}}</span> /
            <span style="color: #B0C4DE;">{{player_exp_to_next}}</span>
            <div style="
                width: 100%;
                height: 8px;
                background: #333;
                border-radius: 4px;
                margin-top: 4px;
                overflow: hidden;
            ">
                <div style="
                    width: {{exp_percent}}%;
                    height: 100%;
                    background: linear-gradient(90deg, #4CAF50, #8BC34A);
                    transition: width 0.3s;
                "></div>
            </div>
        </div>
    </div>

    <!-- 스탯 -->
    <div style="
        margin-bottom: 12px;
        padding: 10px;
        background: rgba(139, 69, 19, 0.2);
        border-radius: 5px;
    ">
        <div style="
            font-weight: bold;
            color: #DDA0DD;
            margin-bottom: 8px;
            font-size: 1.1em;
        ">📈 능력치</div>
        <div style="
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        ">
            <div style="color: #FFB6C1;">
                <strong style="color: #FF6B6B;">STR:</strong> <span style="color: #FFDAB9;">{{player_str}}</span>
            </div>
            <div style="color: #87CEEB;">
                <strong style="color: #4FC3F7;">INT:</strong> <span style="color: #FFDAB9;">{{player_int}}</span>
            </div>
            <div style="color: #90EE90;">
                <strong style="color: #66BB6A;">DEX:</strong> <span style="color: #FFDAB9;">{{player_dex}}</span>
            </div>
            <div style="color: #FFD700;">
                <strong style="color: #FDD835;">CHA:</strong> <span style="color: #FFDAB9;">{{player_cha}}</span>
            </div>
            <div style="color: #DDA0DD;">
                <strong style="color: #BA68C8;">LUK:</strong> <span style="color: #FFDAB9;">{{player_luk}}</span>
            </div>
            <div style="color: #FF6B6B;">
                <strong style="color: #E53935;">VIT:</strong> <span style="color: #FFDAB9;">{{player_vit}}</span>
            </div>
        </div>
    </div>

    <!-- 아이템 (있을 경우에만 표시) -->
    <div style="
        margin-bottom: 12px;
        padding: 10px;
        background: rgba(139, 69, 19, 0.2);
        border-radius: 5px;
        {{#if_has_items}}{{/if_has_items}}
    ">
        <div style="
            font-weight: bold;
            color: #FFB6C1;
            margin-bottom: 8px;
            font-size: 1.1em;
        ">🎒 소지 아이템</div>
        <div style="
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        ">
            {{items_list}}
        </div>
    </div>

    <!-- Traits (있을 경우에만 표시) -->
    <div style="
        padding: 10px;
        background: rgba(139, 69, 19, 0.2);
        border-radius: 5px;
        {{#if_has_traits}}{{/if_has_traits}}
    ">
        <div style="
            font-weight: bold;
            color: #B0C4DE;
            margin-bottom: 8px;
            font-size: 1.1em;
        ">🌟 특성</div>
        <div style="
            display: flex;
            flex-direction: column;
            gap: 4px;
        ">
            {{traits_list}}
        </div>
    </div>
</div>
