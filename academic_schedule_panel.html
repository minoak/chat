<style>
.week-calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin: 10px 0;
}

.day-box {
  padding: 8px;
  text-align: center;
  background: #16213e;
  border: 1px solid #444;
  border-radius: 4px;
  font-size: 12px;
  color: #999;
}

.day-box.today {
  background: #c9a961;
  color: #1a1a2e;
  font-weight: bold;
}
</style>

<div style="max-width: 650px; margin: 15px auto; background: #1a1a2e; border: 2px solid #c9a961; border-radius: 10px; padding: 20px; font-family: Arial, sans-serif;">

  <h2 style="color: #c9a961; text-align: center; margin: 0 0 15px 0; font-size: 20px;">📅 학사 일정</h2>

  <div style="background: #16213e; padding: 15px; border-radius: 8px; margin-bottom: 15px;">

    <p style="color: #c9a961; margin: 0 0 8px 0; font-size: 14px; text-align: center;">
      {{getvar::current_season}} 학기 Week {{getvar::week_of_season}} | {{getvar::current_time}}
    </p>

    <div class="week-calendar">
      <div class="day-box {{#if {{equal::{{getvar::day_of_week}}::1}}}}today{{/if}}">월</div>
      <div class="day-box {{#if {{equal::{{getvar::day_of_week}}::2}}}}today{{/if}}">화</div>
      <div class="day-box {{#if {{equal::{{getvar::day_of_week}}::3}}}}today{{/if}}">수</div>
      <div class="day-box {{#if {{equal::{{getvar::day_of_week}}::4}}}}today{{/if}}">목</div>
      <div class="day-box {{#if {{equal::{{getvar::day_of_week}}::5}}}}today{{/if}}">금</div>
      <div class="day-box {{#if {{equal::{{getvar::day_of_week}}::6}}}}today{{/if}}">토</div>
      <div class="day-box {{#if {{equal::{{getvar::day_of_week}}::7}}}}today{{/if}}">일</div>
    </div>

  </div>

  <div style="background: #16213e; padding: 12px; border-radius: 8px; border-left: 3px solid #c9a961;">
    <p style="color: #c9a961; margin: 0 0 4px 0; font-size: 13px; font-weight: bold;">이번 주 일정</p>
    <p style="color: #ccc; margin: 0; font-size: 12px;">정규 수업 진행중</p>
  </div>

</div>
