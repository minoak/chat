<div style="max-width: 650px; margin: 15px auto; background: #1a1a2e; border: 2px solid #c9a961; border-radius: 10px; padding: 20px; font-family: Arial, sans-serif;">

  <h2 style="color: #c9a961; text-align: center; margin: 0 0 15px 0; font-size: 20px;">📅 정보 패널</h2>

  <!-- 현재 시간 -->
  <div style="background: #16213e; padding: 15px; border-radius: 8px; margin-bottom: 12px; text-align: center;">
    <p style="color: #c9a961; margin: 0; font-size: 14px;">
      {{getvar::current_season}} 학기 Week {{getvar::week_of_season}}/12
    </p>
    <p style="color: #ddd; margin: 5px 0 0 0; font-size: 13px;">
      {{getvar::day_of_week_name}} {{getvar::current_time}}
    </p>
  </div>

  <!-- 현재 위치 -->
  <div style="background: #16213e; padding: 12px; border-radius: 8px; margin-bottom: 12px; border-left: 3px solid #c9a961;">
    <p style="color: #c9a961; margin: 0 0 6px 0; font-size: 13px; font-weight: bold;">📍 현재 위치</p>
    <p style="color: #ccc; margin: 0; font-size: 12px;">{{getvar::current_location}}</p>
  </div>

  <!-- 학사 일정 -->
  <div style="background: #16213e; padding: 12px; border-radius: 8px; border-left: 3px solid #c9a961;">
    <p style="color: #c9a961; margin: 0 0 6px 0; font-size: 13px; font-weight: bold;">📋 이번 주</p>
    <p style="color: #ccc; margin: 0; font-size: 12px;">정규 수업 진행중</p>
  </div>

</div>
